<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ML Quiz">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<title>ML Quiz</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.5/katex.min.css"
      integrity="sha384-2dNi/m6JtSiviznrOIZ5fTiZ5As0In2QwkuXSgoqcQtCNplvJAbt+jveeN+8en73"

<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <h1 class="title">ML Quiz</h1>
  <div class="seg" id="type-tabs" role="tablist" aria-label="문제 유형">
    <button type="button" class="seg-btn" data-type="short" role="tab">단답형</button>
    <button type="button" class="seg-btn" data-type="essay" role="tab">서술형</button>
  </div>
  <nav class="jump" id="jump" aria-label="주제 바로가기"></nav>
</header>

<main class="list" id="list"></main>

<script defer
        src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.5/katex.min.js"
        integrity="sha384-TTF8eEsEKInX2meLzP5V1z/npGYIElXYGksx93f0qBZHu6IL3PdzVB8objytx+TR"
        crossorigin="anonymous"></script>
<script defer
        src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.5/contrib/auto-render.min.js"
        integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
        crossorigin="anonymous"></script>

</html>
